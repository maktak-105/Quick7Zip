name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW and Python
        shell: pwsh
        run: choco install mingw python --yes --no-progress
      - name: Install pinned WebView2 SDK
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'webview2.nupkg'
          $archive = Join-Path $env:RUNNER_TEMP 'webview2.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'webview2'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.4129.50' -OutFile $package
          dotnet nuget verify $package --all
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 NuGet signature verification failed' }
          Copy-Item -LiteralPath $package -Destination $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory -Force
          "WEBVIEW2_INCLUDE=$directory\build\native\include" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WEBVIEW2_LOADER=$directory\build\native\x64\WebView2Loader.dll" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python build_native.py
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
      - name: CLI smoke test
        shell: pwsh
        run: .\dist\binary\Quick7Zip_cli.exe --help
      - name: Engine tests
        shell: pwsh
        run: python tests/run_tests.py
